<script>
/* ============================================================================
   Fresh integrative items for the final assessment only.
   These do NOT appear as unit checkpoints. Each crosses two or more units.
   ========================================================================= */
window.EXAM_ITEMS = (function(){
function I(id, unit, stem, opts, rationale){
  return { id:id, unit:unit, source:"fresh", stem:stem,
           opts: opts.map(function(o){ return { html:o[0], correct:!!o[1] }; }),
           rationale: rationale };
}
return [

I("X01", 3,
 "A term baby is born limp and apnoeic through clear liquor. Drying and stimulation produce no response. At 60 seconds the heart rate is 80/min. The team starts PPV in 21% oxygen. At 90 seconds the heart rate is 70/min, the chest is not moving and the CO&#8322; detector is purple. Which single action is correct?",
 [["Start chest compressions, as the heart rate has not improved after 30 seconds of ventilation.", 0],
  ["Increase FiO&#8322; to 100% and reassess in 30 seconds.", 0],
  ["Begin the ventilation corrective steps, starting with mask adjustment and repositioning.", 1],
  ["Give endotracheal epinephrine while an umbilical venous catheter is prepared.", 0]],
 "<h6>Why</h6><p>Two independent signals &mdash; no chest movement and a purple CO&#8322; detector &mdash; say the lungs are not being inflated. The 30-second clock for escalation starts only when ventilation is <b>aerating the lungs</b>. The correct response to a heart rate that is not rising with no chest movement is <b>MR SOPA</b>.</p><div class='why-wrong'><b>Compressions</b> require &ge;30 s of ventilation that inflates the lungs; compressing an unventilated chest circulates deoxygenated blood. <b>Raising FiO&#8322;</b> does nothing if gas is not reaching the alveoli. <b>Epinephrine</b> sits two blocks higher and depends even more completely on effective ventilation.</div>"),

I("X02", 9,
 "A 34-week infant is 3 minutes old, breathing with mild recession, heart rate 150/min, pre-ductal SpO&#8322; 68% on 25% oxygen. What should you do?",
 [["Nothing &mdash; 68% at 3 minutes is within target.", 0],
  ["Increase FiO&#8322;, because the 3-minute target is 70&ndash;75%.", 1],
  ["Start PPV, because the saturation is below target despite oxygen.", 0],
  ["Reduce FiO&#8322; to 21%, because preterm infants tolerate lower saturations.", 0]],
 "<h6>Why</h6><p>The 2025 target table reads 2&nbsp;min 65&ndash;70 &middot; 3&nbsp;min 70&ndash;75 &middot; 4&nbsp;min 75&ndash;80 &middot; 5&nbsp;min 80&ndash;85 &middot; 10&nbsp;min 85&ndash;95. At 3 minutes, 68% is marginally below target; titrate FiO&#8322; upward, typically in 20&ndash;30% increments every 30 seconds.</p><div class='why-wrong'>68% would have been within target at <b>2</b> minutes, not 3 &mdash; the commonest way this item is missed. <b>PPV</b> is not indicated: she is breathing with a heart rate of 150. There is <b>no separate preterm target table</b>.</div>"),

I("X03", 17,
 "A 2 kg infant needs intravenous epinephrine. Only 1&nbsp;mg/mL ampoules are stocked. What is the safest immediate course?",
 [["Give 0.04 mL of the 1 mg/mL solution, which equals 0.02 mg/kg.", 0],
  ["Dilute 1 mL of 1 mg/mL into 9 mL of normal saline to make 0.1 mg/mL, then give 0.4 mL, following a written pre-calculated instruction.", 1],
  ["Give 0.4 mL of the 1 mg/mL solution and halve subsequent doses.", 0],
  ["Give the dose endotracheally instead, since the concentration does not matter by that route.", 0]],
 "<h6>Why</h6><p>The only concentration used in neonatal resuscitation is <b>0.1 mg/mL</b>. Where only 1&nbsp;mg/mL is available, the dilution must be prepared from a <b>written, laminated instruction</b> &mdash; 1 mL into 9 mL of saline &mdash; ideally before the birth when risk factors exist. 0.02 mg/kg &times; 2 kg = 0.04 mg = <b>0.4 mL</b> of 0.1 mg/mL.</p><div class='why-wrong'>Drawing <b>0.04 mL</b> in an emergency is not reliably measurable and invites a decimal error. <b>0.4 mL of 1 mg/mL</b> is a ten-fold overdose. <b>Concentration matters by every route</b>; the endotracheal dose is five-fold higher by mass, not concentration-independent.</div>"),

I("X04", 5,
 "A 26-week infant is delivering. Deferred cord clamping cannot be performed because the mother is haemodynamically unstable. Which action is correct?",
 [["Milk the intact cord three times, then clamp.", 0],
  ["Clamp immediately and move the infant to the warmer for the initial steps and thermal bundle.", 1],
  ["Defer clamping for 30 seconds as a compromise.", 0],
  ["Milk the cord once, more gently than usual.", 0]],
 "<h6>Why</h6><p>Two rules converge. <b>Intact cord milking is not recommended below 28 weeks</b> &mdash; it is associated with increased severe intraventricular haemorrhage. And when the mother is haemodynamically unstable or the placental circulation is not intact, the cord is <b>clamped immediately</b>.</p><div class='why-wrong'>Milking &mdash; in any number of passes or at any gentleness &mdash; is the specific manoeuvre prohibited at this gestation. A 30-second &lsquo;compromise&rsquo; ignores the maternal indication for immediate clamping.</div>"),

I("X05", 12,
 "Ventilating a 28-week infant by mask, the heart rate rises from 50 to 120/min. The assistant sees no chest movement. The CO&#8322; detector turns yellow. What do you do?",
 [["Increase PIP in 5 cm H&#8322;O steps until chest movement appears.", 0],
  ["Continue at current settings and reassess at 30 seconds.", 1],
  ["Intubate, since mask ventilation has not produced chest movement.", 0],
  ["Perform all six MR SOPA steps before reassessing.", 0]],
 "<h6>Why</h6><p>A <b>rising heart rate</b> is the single most important indicator of effective ventilation, and exhaled CO&#8322; independently confirms gas exchange. In very preterm infants, effective ventilation frequently produces <b>no perceptible chest movement</b>. Two convergent positive signals beat one absent one.</p><div class='why-wrong'>Escalating pressure to chase a sign that will not appear causes volutrauma and pneumothorax. Intubation is indicated when the heart rate is <b>not</b> increasing. MR SOPA is triggered by a heart rate that is not rising <i>and</i> no chest movement &mdash; both, not either.</div>"),

I("X06", 15,
 "A team has ventilated through an endotracheal tube for 30 seconds with good chest movement; the heart rate is 55/min. Which set of actions is correct before starting compressions?",
 [["Increase FiO&#8322; to 100%, move the compressor to the head of the bed, and begin 3:1 at 90 compressions plus 30 breaths per minute.", 1],
  ["Keep FiO&#8322; at 21%, compress from the side of the bed, and use a 15:2 ratio.", 0],
  ["Increase FiO&#8322; to 100% and compress at 120/min without coordinating ventilations.", 0],
  ["Give epinephrine first, then start compressions if there is no response.", 0]],
 "<h6>Why</h6><p>When compressions begin, <b>FiO&#8322; goes to 100%</b>, the compressor moves to the <b>head of the bed</b> (leaving the umbilicus free for a UVC and reducing fatigue), and the ratio is <b>3:1 &mdash; 90 compressions plus 30 breaths, 120 events per minute</b>.</p><div class='why-wrong'>15:2 and asynchronous ventilation are paediatric/adult approaches not shown to improve newborn recovery. Epinephrine requires a further 60 seconds of coordinated compressions before it is indicated.</div>"),

I("X07", 21,
 "A baby is born with a scaphoid abdomen and severe respiratory distress. Which sequence is correct?",
 [["Bag-mask ventilation, then intubate if it fails.", 0],
  ["Intubate promptly and place an orogastric tube on suction, avoiding face-mask ventilation.", 1],
  ["CPAP at 6 cm H&#8322;O, then surfactant.", 0],
  ["Needle decompression of the affected hemithorax.", 0]],
 "<h6>Why</h6><p>A scaphoid abdomen with respiratory distress suggests <b>congenital diaphragmatic hernia</b>. Bowel loops lie in the chest; any mask-delivered positive pressure distends them, further compressing a hypoplastic lung and shifting the mediastinum. Intubate, then decompress.</p><div class='why-wrong'>Both bag-mask ventilation and CPAP are mask-delivered positive pressure and make it worse. Needling a chest containing bowel risks perforation.</div>"),

I("X08", 20,
 "A 39-week infant needed 5 minutes of PPV after a cord prolapse. At 50 minutes she is lethargic with absent suck and hypotonia, and the axillary temperature is 37.9&nbsp;&deg;C under a radiant warmer on manual. What is the priority?",
 [["Give paracetamol and take blood cultures.", 0],
  ["Reduce warmer output to prevent further hyperthermia and contact the cooling centre immediately.", 1],
  ["Apply ice packs to begin cooling while awaiting transfer.", 0],
  ["Complete a full neurological examination and reassess at 3 hours.", 0]],
 "<h6>Why</h6><p>All three criteria for therapeutic hypothermia are present: &ge;36 weeks, a sentinel hypoxic event with birth depression, and moderate-to-severe encephalopathy. The window is <b>6 hours</b> and the rate-limiting step in a non-cooling hospital is <b>transfer</b>. Hyperthermia worsens outcome in an injured brain.</p><div class='why-wrong'>Antipyretics do not address iatrogenic overheating. <b>Never improvise cooling</b> &mdash; uncontrolled cooling overshoots; hypothermia must follow a defined protocol. Waiting until 3 hours consumes the window.</div>"),

I("X09", 11,
 "Which single statement about a self-inflating bag is true?",
 [["It can deliver CPAP if a PEEP valve is attached.", 0],
  ["It re-inflates whether or not there is a mask seal, so it gives no warning of a leak.", 1],
  ["It can deliver free-flow oxygen through its mask.", 0],
  ["It requires a compressed gas source to function.", 0]],
 "<h6>Why</h6><p>The self-inflating bag's greatest danger is that it <b>re-inflates regardless of seal</b>, so a large mask leak feels entirely normal in the hand. Where it is the only device, the team must become the leak detector &mdash; watching heart rate and chest movement.</p><div class='why-wrong'>It <b>cannot</b> deliver CPAP even with a PEEP valve (no gas flows between squeezes), and cannot deliver free-flow oxygen through the mask (only through an open tail reservoir). It is the one device that works <b>without</b> compressed gas &mdash; which is why it must be available everywhere.</div>"),

I("X10", 8,
 "An assistant auscultates for 6 seconds, counts 5 beats, and reports &lsquo;heart rate 30&rsquo;. What is the true rate and the correct action?",
 [["30/min &mdash; start compressions.", 0],
  ["50/min &mdash; below 60, so compressions are indicated if ventilation is already inflating the lungs.", 1],
  ["5/min &mdash; treat as asystole.", 0],
  ["300/min &mdash; treat as supraventricular tachycardia.", 0]],
 "<h6>Why</h6><p>Beats in six seconds are multiplied by <b>10</b>, not 6. Five beats in six seconds is <b>50/min</b>. Both 30 and 50 lie below the compressions threshold here, so the immediate action happens to be the same &mdash; but the arithmetic error would matter at 7 beats (70 versus 42), where it crosses the threshold and would start compressions unnecessarily.</p><div class='teach'>Always report as &lsquo;<i>x</i> beats per minute&rsquo; and tap the beat out on the mattress so a second person can check.</div>"),

I("X11", 7,
 "A vigorous term infant is born through thick meconium. What is correct?",
 [["Routine initial steps with the parent; no suction, no laryngoscopy.", 1],
  ["Laryngoscopy and tracheal suction before the first breath.", 0],
  ["Bulb suction of mouth and nose, then skin-to-skin.", 0],
  ["Intubation and suction only if meconium is seen below the cords.", 0]],
 "<h6>Why</h6><p>The meconium algorithm branches on whether the <b>baby</b> is vigorous, not on the appearance of the liquor. A vigorous infant receives routine initial steps with the parent. Routine laryngoscopy with or without tracheal suction is <b>not recommended</b> in either branch.</p><div class='why-wrong'>The bulb-suction option is the subtle distractor: <b>routine suctioning is not recommended</b> even here, and stimulating the posterior pharynx can cause vagal bradycardia. Suction is for <i>suspected obstruction</i> &mdash; and a vigorous crying baby is not obstructed.</div>"),

I("X12", 19,
 "Which action most increases the risk of intraventricular haemorrhage in a 25-week infant?",
 [["PEEP of 5 cm H&#8322;O from the first inflations.", 0],
  ["A rapid 20 mL/kg saline push for a borderline blood pressure.", 1],
  ["Head midline, slightly elevated, body supine.", 0],
  ["Titrating FiO&#8322; in 20&ndash;30% increments against oximetry.", 0]],
 "<h6>Why</h6><p>Below 32 weeks, volume boluses in the first day, boluses given <b>rapidly</b>, and boluses <b>greater than 10 mL/kg</b> are each associated with increased intracranial haemorrhage. A rapid 20 mL/kg push breaks all three. Volume goes at 10 mL/kg over 5&ndash;10 minutes, and only for shock or a history of acute blood loss.</p><div class='teach'>The unifying principle: in the very preterm brain, the <b>rate</b> of a haemodynamic change is itself the hazard. The same logic prohibits cord milking below 28 weeks and rapid sodium bicarbonate.</div>"),

I("X13", 14,
 "Intubating a 30-week infant, the nasal-tragus length is 5.0 cm. What is the insertion depth at the gum, and which tube size?",
 [["5.0 cm; 2.5 mm.", 0],
  ["6.0 cm; 3.0 mm.", 1],
  ["7.0 cm; 3.5 mm.", 0],
  ["6.0 cm; 2.5 mm.", 0]],
 "<h6>Why</h6><p>Depth = <b>NTL + 1 cm</b> = 6.0 cm at the anterior edge of the upper gum. At 29&ndash;34 weeks (roughly 1201&ndash;2200 g) the tube is <b>3.0 mm</b> internal diameter. The gestational-age table independently gives 7.0 cm for 30&ndash;32 weeks &mdash; both methods are estimates, and units should use one consistently; confirm by auscultation and, if the tube stays, radiography.</p><div class='why-wrong'>Omitting the +1 cm leaves the tip too high. 3.5 mm is for &gt;2200 g / &gt;34 weeks; 2.5 mm is for &le;1200 g / &le;28 weeks.</div>"),

I("X14", 18,
 "A term infant has had no detectable heart rate for 22 minutes despite complete and appropriate resuscitation. Which statement best reflects current guidance?",
 [["Resuscitation must be stopped at exactly 20 minutes.", 0],
  ["Around 20 minutes is a reasonable point to consider cessation, individualised to the patient and context and discussed with team and family.", 1],
  ["Resuscitation should continue for 60 minutes before cessation is considered.", 0],
  ["The decision rests solely with the most senior clinician and does not involve the family.", 0]],
 "<h6>Why</h6><p>Around 20 minutes is a reasonable time frame for <b>considering</b> cessation; the decision must be <b>individualised</b> against gestation, anomalies, the nature and timing of the insult, whether all appropriate interventions were performed, family values, and available post-resuscitation resources &mdash; and <b>discussed with the team and the family</b>.</p><div class='why-wrong'>It is not a rule with a fixed endpoint in either direction, and parents are generally the appropriate surrogate decision-makers.</div>"),

I("X15", 6,
 "A 30-week infant is delivered into a labour room at 20&nbsp;&deg;C with a ceiling fan running. Which action has the largest immediate effect on her temperature?",
 [["Apply a cap.", 0],
  ["Switch off the fan and shut the door, and raise the room temperature toward 23&ndash;25&nbsp;&deg;C.", 1],
  ["Dry her with three successive warm towels.", 0],
  ["Place her on an unactivated thermal mattress.", 0]],
 "<h6>Why</h6><p>A running fan in a cold room drives <b>convective</b> heat loss continuously, and it is free and instant to remove. Raising room temperature toward 23&ndash;25&nbsp;&deg;C is the environmental foundation on which the rest of the bundle sits.</p><div class='why-wrong'>A cap helps but is a smaller effect. Below 32 weeks she should go into <b>polyethylene wrap without drying</b>, so successive towels is the wrong manoeuvre entirely. An <b>unactivated</b> mattress provides no heat.</div>"),

I("X16", 10,
 "After the initial steps, a 36-week infant is making shallow irregular efforts with a heart rate of 95/min at 55 seconds. What is indicated?",
 [["CPAP at 5&ndash;6 cm H&#8322;O.", 0],
  ["PPV at 30&ndash;60 breaths/min, PIP 25, PEEP 5, FiO&#8322; 21%.", 1],
  ["Free-flow oxygen at 30%.", 0],
  ["Continued stimulation and reassessment at 2 minutes.", 0]],
 "<h6>Why</h6><p>A heart rate <b>below 100/min</b> is independently an indication for assisted ventilation, whether or not there is some respiratory effort. At 36 weeks the starting FiO&#8322; is <b>21%</b> (&ge;35 weeks).</p><div class='why-wrong'>CPAP requires a heart rate of <b>at least 100/min</b> &mdash; at 95 it is contraindicated. Free-flow oxygen does nothing for inadequate ventilation. Waiting to 2 minutes breaks the 1-minute deadline.</div>"),

I("X17", 13,
 "Ventilating a term infant by mask, there is no chest movement and no heart-rate rise. You have adjusted the mask and repositioned the head. What comes next in MR SOPA, and what is the pressure ceiling for this baby?",
 [["Pressure increase; ceiling 30 cm H&#8322;O.", 0],
  ["Suction the mouth and nose, then open the mouth; the ceiling once you reach P is 40 cm H&#8322;O.", 1],
  ["Alternative airway immediately; no ceiling applies.", 0],
  ["Repeat mask adjustment indefinitely until the chest moves.", 0]],
 "<h6>Why</h6><p>MR SOPA runs <b>M</b>ask &rarr; <b>R</b>eposition &rarr; <b>S</b>uction &rarr; <b>O</b>pen the mouth &rarr; <b>P</b>ressure &rarr; <b>A</b>lternative airway. After M and R come S and O. The face-mask maximum is <b>40 cm H&#8322;O term</b>, 30 preterm, reached in 5 cm increments.</p><div class='why-wrong'>Jumping to P skips two cheap obstruction fixes; 30 is the <b>preterm</b> ceiling. Going straight to an alternative airway skips three steps. Repeating one step indefinitely is how teams lose minutes.</div>"),

I("X18", 22,
 "A newborn with prenatally diagnosed hypoplastic left heart syndrome has a pre-agreed target SpO&#8322; of 75&ndash;85% at 10 minutes. At 8 minutes SpO&#8322; is 88% on 40% oxygen. What should you do?",
 [["Nothing &mdash; 88% is within the standard 10-minute range.", 0],
  ["Reduce FiO&#8322;, because excess oxygen dilates the pulmonary bed and steals flow from the systemic circulation.", 1],
  ["Increase FiO&#8322; to reach 92%.", 0],
  ["Start CPAP to improve oxygenation further.", 0]],
 "<h6>Why</h6><p>In duct-dependent systemic circulation, the lungs and the body <b>compete</b> for one cardiac output. Oxygen lowers pulmonary vascular resistance, sends more blood to the lungs and <b>reduces systemic perfusion</b>. The saturation number improves while organ perfusion worsens. Reduce FiO&#8322; toward the agreed range.</p><div class='teach'>A monitor reading is a proxy. Be suspicious of any intervention that improves the number by a mechanism you cannot explain.</div>"),

I("X19", 16,
 "During a resuscitation the umbilical venous catheter is advanced 8 cm and blood is aspirated. What is the risk?",
 [["None &mdash; 8 cm is the correct emergency depth in a term infant.", 0],
  ["The tip may lie in the liver, so drugs are infused into hepatic tissue causing injury.", 1],
  ["The catheter is too short to reach the central circulation.", 0],
  ["Air embolism is inevitable at this depth.", 0]],
 "<h6>Why</h6><p>An <b>emergency</b> UVC is advanced only until blood can be freely aspirated &mdash; typically <b>3&ndash;4 cm</b> beyond the abdominal wall, and less in extremely preterm infants. Deeper insertion risks the tip lodging in hepatic parenchyma or a portal vessel, with epinephrine infused directly into the liver.</p><div class='why-wrong'>8 cm is closer to an <b>elective</b> UVC depth, which is a different procedure with radiographic confirmation and a tip above the diaphragm.</div>"),

I("X20", 23,
 "A 3-day-old ventilated 26-week infant suddenly desaturates with bradycardia and a flat capnography trace. What is the first response?",
 [["Start chest compressions.", 0],
  ["Work through DOPE and hand-ventilate while calling for help.", 1],
  ["Give intravenous epinephrine through the existing UVC.", 0],
  ["Increase ventilator rate and FiO&#8322; and observe for 2 minutes.", 0]],
 "<h6>Why</h6><p>A flat capnography trace means no CO&#8322; is being exhaled &mdash; a <b>ventilation</b> failure until proved otherwise. <b>DOPE</b>: Displaced tube, Obstructed tube, Pneumothorax, Equipment failure. Unplanned extubation is far commoner than myocardial failure and is corrected in seconds.</p><div class='why-wrong'>Compressions and epinephrine both presuppose effective ventilation. Adjusting the ventilator when the circuit may not reach the baby wastes the reversible interval.</div>"),

I("X21", 4,
 "You audit a labour-room trolley and find a 750 mL self-inflating bag, adult-size masks, a bulb syringe, and both 0.1 mg/mL and 1 mg/mL epinephrine. Which change should be made first?",
 [["Replace the 750 mL bag with a 240 or 500 mL bag.", 0],
  ["Remove the 1 mg/mL epinephrine from the trolley.", 1],
  ["Order neonatal masks.", 0],
  ["Replace the bulb syringe with a mechanical suction unit.", 0]],
 "<h6>Why</h6><p>All four are real defects, but only one is a <b>trap</b> &mdash; an item whose presence creates an undetectable ten-fold overdose at the moment of maximum cognitive load. The remedy is <b>elimination</b>, not vigilance. The others degrade performance but leave a workaround and are visible failures.</p><div class='teach'>When auditing a trolley, ask not only &lsquo;what is missing?&rsquo; but &lsquo;what is present that could be picked up by mistake?&rsquo;</div>"),

I("X22", 2,
 "A newborn makes deep single inspirations every 6&ndash;8 seconds and is flaccid at 50 seconds of life. What is this, and what does it require?",
 [["Periodic breathing &mdash; observe.", 0],
  ["Gasping &mdash; a terminal sign equivalent to apnoea; start PPV within the first minute.", 1],
  ["Primary apnoea &mdash; vigorous stimulation is sufficient.", 0],
  ["Secondary apnoea &mdash; start compressions.", 0]],
 "<h6>Why</h6><p>Gasping sits between primary and secondary apnoea on the hypoxic cascade. It is a reflex, not respiratory effort, and produces no gas exchange. <b>Gasping counts as apnoea</b> for the PPV indication.</p><div class='why-wrong'>Primary and secondary apnoea are indistinguishable at the bedside, so you assume the dangerous one and ventilate. Compressions are contraindicated before the lungs are inflated.</div>"),

I("X23", 1,
 "At an uncomplicated term birth with no risk factors, what is the minimum staffing standard?",
 [["A qualified person may be summoned if the baby does not cry.", 0],
  ["At least one qualified person, skilled in the initial steps and PPV, whose only responsibility is the newborn.", 1],
  ["Two qualified people solely for the newborn.", 0],
  ["No dedicated person is required when risk factors are absent.", 0]],
 "<h6>Why</h6><p>One dedicated, qualified person at <b>every</b> birth is the floor. Risk assessment scales the team <i>upward</i> &mdash; two dedicated people if risk factors are present, the full team present if complex resuscitation is anticipated &mdash; never to zero, because a meaningful proportion of babies needing ventilation have no identified risk factor.</p><div class='why-wrong'>&lsquo;Summoned if needed&rsquo; fails the 60-second clock. Two dedicated people is the standard when risk factors <i>are</i> present.</div>"),

I("X24", 20,
 "Three hours after a resuscitation, a term infant is tachypnoeic on 30% oxygen. Which combination is correct?",
 [["Bathe, feed fully, and suction hourly.", 0],
  ["Check glucose serially, consider radiograph, gas, cultures and antibiotics; avoid suctioning; cluster care; delay bathing and feeds.", 1],
  ["Give sodium bicarbonate and target SpO&#8322; 100%.", 0],
  ["No action; post-resuscitation tachypnoea always resolves within 6 hours.", 0]],
 "<h6>Why</h6><p>Ongoing distress with an oxygen requirement raises three questions at once &mdash; retained lung fluid, pneumonia or sepsis, pulmonary hypertension &mdash; and the pulmonary vascular bed is labile. Investigate, and <b>suspend the routine</b>: no unnecessary suction, no bath, cluster care, delay feeds with IV fluids.</p><div class='why-wrong'>Bicarbonate is not recommended; targeting 100% buys nothing and costs oxidative injury. Every action in the first option is a routine nursery task that is actively harmful here.</div>"),

I("X25", 24,
 "A unit introduces a preterm thermal bundle. Admission hypothermia falls from 38% to 12%. Which measure must be reported alongside it?",
 [["Length of stay.", 0],
  ["Proportion admitted with temperature above 37.5&nbsp;&deg;C.", 1],
  ["Proportion of births attended by two staff.", 0],
  ["Proportion of infants who received plastic wrap.", 0]],
 "<h6>Why</h6><p>A <b>balancing measure</b> asks whether the project caused a new problem. Combining a radiant warmer, thermal mattress, wrap and cap is documented to <b>overheat</b> infants, and hyperthermia is associated with worse outcomes. Reporting only the fall in hypothermia tells half the story.</p><div class='why-wrong'>Wrap use and staffing are <b>process</b> measures &mdash; worth collecting, but they do not detect harm. Length of stay is far too distal and insensitive.</div>"),

I("X26", 15,
 "After 60 seconds of compressions the heart rate is unchanged at 45/min. Which question is <b>not</b> part of the five-question check?",
 [["Is the chest moving with each breath?", 0],
  ["Is 100% oxygen being delivered?", 0],
  ["Has a blood gas been obtained?", 1],
  ["Is compression depth one-third of the AP chest diameter?", 0]],
 "<h6>Why</h6><p>The five questions are all bedside, immediately actionable checks of <b>technique</b>: airway secured, chest moving, 100% oxygen, 3:1 every 2 seconds, depth one-third. A blood gas is valuable later but is neither immediate nor a technique check, and sending one does not change what your hands are doing in the next ten seconds.</p><div class='teach'>Under load, prefer checks you can complete without leaving the baby.</div>"),

I("X27", 9,
 "Which statement about CPAP in the delivery room is correct?",
 [["It can be given with a self-inflating bag and a PEEP valve.", 0],
  ["It is indicated for a spontaneously breathing infant with a heart rate of at least 100/min who has laboured breathing, at 5&ndash;6 cm H&#8322;O and never above 8.", 1],
  ["It is preferred over PPV in an apnoeic preterm infant.", 0],
  ["Pressures of 10&ndash;12 cm H&#8322;O are appropriate if recession persists.", 0]],
 "<h6>Why</h6><p>CPAP requires <b>spontaneous breathing and a heart rate &ge;100/min</b>, is set at <b>5&ndash;6 cm H&#8322;O</b>, and should <b>not exceed 8</b>. It is delivered by T-piece or flow-inflating bag with a sealed mask.</p><div class='why-wrong'>A self-inflating bag cannot deliver CPAP even with a PEEP valve. An apnoeic infant needs PPV, not CPAP &mdash; they are not points on one scale of intensity.</div>"),

I("X28", 3,
 "Which of the following is a change introduced in the 2025 guidelines?",
 [["The target saturation table now begins at 2 minutes rather than 1 minute.", 1],
  ["The compression-to-ventilation ratio changed from 3:1 to 15:2.", 0],
  ["Epinephrine concentration changed to 1 mg/mL.", 0],
  ["Routine tracheal suction for non-vigorous meconium-stained infants was reinstated.", 0]],
 "<h6>Why</h6><p>The 1-minute row was removed: oximeters rarely lock on that fast, and a target there invited oxygen titration at the moment the algorithm needs a different decision &mdash; <i>is ventilation indicated?</i> Other 2025 changes include gestation-banded initial FiO&#8322;, PIP 25, free-flow oxygen starting at 30%, the laryngeal mask as a first-line option, video laryngoscopy recommended over direct, and intraosseous access endorsed.</p><div class='why-wrong'>The other three are inventions &mdash; 3:1 stands, 0.1 mg/mL stands, and routine tracheal suction has not been recommended since 2016.</div>"),

I("X29", 17,
 "Which is a correct indication for volume expansion?",
 [["Any infant whose heart rate remains below 60/min after two doses of epinephrine.", 0],
  ["An infant not responding to resuscitation with signs of shock or a history of acute blood loss.", 1],
  ["Routinely in every infant who requires chest compressions.", 0],
  ["Any preterm infant with a blood pressure below the gestational mean.", 0]],
